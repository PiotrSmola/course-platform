name: course-platform

services:
  db:
    image: postgres:16
    container_name: cp_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: courseplatform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    image: course-platform/elasticsearch:8.19.0
    container_name: cp_elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: cp_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
      MINIO_API_STALE_UPLOADS_EXPIRY: 72h
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio_init:
    image: minio/mc:latest
    container_name: cp_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      set -e;
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'Waiting for MinIO...';
        sleep 1;
      done;
      mc mb -p local/course-platform || true;
      mc anonymous set none local/course-platform || true;
      echo 'MinIO init done.';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio12345}

  api:
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    container_name: cp_api
    working_dir: /src/src/CoursePlatform.API
    command: dotnet run --urls http://0.0.0.0:8080
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required — copy .env.example to .env and set a unique key}
      Jwt__Issuer: CoursePlatform
      Jwt__Audience: CoursePlatform
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-120}
      Minio__InternalEndpoint: http://minio:9000
      Minio__PublicEndpoint: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      Minio__AccessKey: ${MINIO_ROOT_USER:-minio}
      Minio__SecretKey: ${MINIO_ROOT_PASSWORD:-minio12345}
      Minio__Bucket: ${MINIO_BUCKET:-course-platform}
      Minio__Region: us-east-1
      Elastic__Enabled: ${ELASTIC_ENABLED:-true}
      Elastic__Uri: http://elasticsearch:9200
      Elastic__CourseIndexName: ${ELASTIC_COURSE_INDEX_NAME:-courseplatform-courses}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      Stripe__Currency: ${STRIPE_CURRENCY:-pln}
      Email__Enabled: "true"
      Email__Host: mailhog
      Email__Port: 1025
      Email__FromAddress: no-reply@courseplatform.local
      Certificates__VerificationBaseUrl: http://localhost:5173/certificates/verify
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: course-platform-api
      ConnectionStrings__Redis: redis:6379
      Stripe__SuccessUrl: ${STRIPE_SUCCESS_URL:-http://localhost:5173/payment/success}
      Stripe__CancelUrl: ${STRIPE_CANCEL_URL:-http://localhost:5173/payment/cancel}
    ports:
      - "8080:8080"
    volumes:
      - .:/src
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_started
      minio:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  redis:
    image: redis:7-alpine
    container_name: cp_redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: cp_aspire
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      DOTNET_DASHBOARD_OTLP_ENDPOINT_URL: http://0.0.0.0:18889
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:18889:18889"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cp_mailhog
    ports:
      - "127.0.0.1:8025:8025"

  stripe_cli:
    image: stripe/stripe-cli:latest
    container_name: cp_stripe_cli
    profiles: ["stripe"]
    command: listen --api-key ${STRIPE_SECRET_KEY} --forward-to http://api:8080/api/payments/webhook
    depends_on:
      - api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cp_frontend
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
  miniodata:
  esdata: