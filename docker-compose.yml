name: course-platform

services:
  db:
    image: postgres:16
    container_name: cp_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: courseplatform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    container_name: cp_api
    working_dir: /src/src/CoursePlatform.API
    command: dotnet watch run --urls http://0.0.0.0:8080
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required — copy .env.example to .env and set a unique key}
      Jwt__Issuer: CoursePlatform
      Jwt__Audience: CoursePlatform
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-120}
    ports:
      - "8080:8080"
    volumes:
      - .:/src
    depends_on:
      - db
    mem_limit: 2g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: cp_frontend
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata: